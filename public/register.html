<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | Fashion Store</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="/index.html">fashion<span>.</span>store</a>
        <nav class="nav-links" id="navbar" aria-label="Main navigation"></nav>
      </div>
    </header>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Join us</p>
        <h1>Create account</h1>
        <p class="subtext">
          Create an account to save your cart and track orders.
        </p>
        <div id="registerNotice" class="notice" hidden></div>
        <form id="registerForm">
          <div class="form-field">
            <label for="name">Full name</label
            ><input
              id="name"
              name="name"
              required
              maxlength="100"
              autocomplete="name"
              placeholder="Your full name"
            />
          </div>
          <div class="form-field">
            <label for="email">Email address</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>
          <div class="form-field">
            <label for="phone">Phone number</label
            ><input
              id="phone"
              name="phone"
              type="tel"
              required
              autocomplete="tel"
              placeholder="Phone number"
            />
          </div>
          <div class="form-field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
              placeholder="At least 8 characters"
            /><small>Use at least 8 characters.</small>
          </div>
          <button
            class="button button-accent button-block"
            id="registerSubmit"
            type="submit"
          >
            Create account
          </button>
        </form>
        <p class="auth-foot">
          Already registered? <a href="/login.html">Log in</a>
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="footer-brand" href="/index.html">fashion.store</a>
        <p>© <span data-year></span> Fashion Store.</p>
      </div>
    </footer>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/register.js"></script>
  </body>
</html>
